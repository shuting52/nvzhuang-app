org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
android.useAndroidX=true
# Kotlin 编译守护进程也要走 IPv4：本机运行环境的网络策略会拦截 JVM 的 IPv6 映射 TCP，
# 不加这句 Kotlin 编译连不上自己的 daemon（Failed connecting to the daemon in 4 retries）。
# 同理 Gradle 客户端 JVM 也要在 GRADLE_OPTS 里加 -Djava.net.preferIPv4Stack=true，否则连不上 Gradle daemon。
kotlin.daemon.jvm.options=-Xmx1g,-Djava.net.preferIPv4Stack=true

android.experimental.disableCompileSdkChecks=true
android.suppressUnsupportedCompileSdk=36
